services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_app
      POSTGRES_PASSWORD: local-rag-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_app -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data

volumes:
  rag-postgres-data:

name: Build and Push Backend Image to ACR

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-acr-image
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: Production

    env:
      AZURE_CORE_OUTPUT: none
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME || 'backendrag' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Validate registry configuration
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [[ -z "$AZURE_CREDENTIALS" ]]; then
            echo "::error::Missing Production environment secret: AZURE_CREDENTIALS"
            exit 1
          fi
          if [[ -z "$AZURE_CONTAINER_REGISTRY_NAME" ]]; then
            echo "::error::Missing GitHub variable: AZURE_CONTAINER_REGISTRY_NAME"
            exit 1
          fi

      - name: Log in to Azure with service principal
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Azure Container Registry
        id: registry
        shell: bash
        run: |
          login_server="$(az acr show \
            --name "$AZURE_CONTAINER_REGISTRY_NAME" \
            --query loginServer \
            --output tsv)"
          if [[ -z "$login_server" ]]; then
            echo "::error::Could not resolve ACR login server for $AZURE_CONTAINER_REGISTRY_NAME"
            exit 1
          fi
          echo "login-server=$login_server" >> "$GITHUB_OUTPUT"
          echo "Using registry: $login_server"

      - name: Log Docker in to ACR
        shell: bash
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.login-server }}/enterprise-rag-api:${{ env.IMAGE_SHA }}
            ${{ steps.registry.outputs.login-server }}/enterprise-rag-api:latest
          labels: |
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image details
        shell: bash
        run: |
          {
            echo "### Azure Container Registry image"
            echo
            echo "\`${{ steps.registry.outputs.login-server }}/enterprise-rag-api:$IMAGE_SHA\`"
            echo
            echo "\`${{ steps.registry.outputs.login-server }}/enterprise-rag-api:latest\`"
            echo
            echo "No Azure Container App was created or updated."
          } >> "$GITHUB_STEP_SUMMARY"
